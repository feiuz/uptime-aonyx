owner: feiuz
repo: uptime-aonyx

# ------------------------------------------------------------
# Monitors V1 : services publics partagés (frontaux Cloudflare → bastion)
# ------------------------------------------------------------
sites:
  - name: Aonyx Hosting (commercial)
    url: https://aonyx.site
    # Cloudflare → bastion → vhost statique. Tolère redirects.
    expectedStatusCodes: [200, 301, 302, 303, 307, 308]

  - name: Espace client
    url: https://account.aonyx.site
    expectedStatusCodes: [200, 301, 302, 303, 307, 308]

  - name: SSO Authentik
    url: https://auth.aonyx.site
    # 302 vers /outpost.goauthentik.io/start = la chaîne SSO répond
    expectedStatusCodes: [200, 302]

  # ----------------------------------------------------------
  # V2 (à venir) — état des nœuds Proxmox via endpoint d'agrégation
  # sur le bastion (api.aonyx.fr/health/node/<id>) :
  # ----------------------------------------------------------
  # - name: Cluster · minecraft-location (.5)
  #   url: https://api.aonyx.fr/health/node/minecraft-location
  # - name: Cluster · aonyx-sites (.205)
  #   url: https://api.aonyx.fr/health/node/aonyx-sites
  # - name: Cluster · aonyx-sites-clstr2 (.206)
  #   url: https://api.aonyx.fr/health/node/aonyx-sites-clstr2
  # - name: Cluster · aonyx-sites-clstr3 (.207)
