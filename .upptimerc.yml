  # - name: Cluster · aonyx-sites-clstr4 (.208)
  #   url: https://api.aonyx.fr/health/node/aonyx-sites-clstr4
  # - name: Bastion (.100)
  #   url: https://api.aonyx.fr/health/bastion

# ------------------------------------------------------------
# Branding du status website public
# ------------------------------------------------------------
status-website:
  cname: uptime.aonyx.fr
  name: Aonyx Hosting · Status
  introTitle: "**Aonyx Hosting** — état des services en temps réel"
  introMessage: |
    État en temps réel des services partagés de l'infrastructure Aonyx Hosting.
    Les sondes tournent sur GitHub Actions toutes les 5 minutes — **indépendant de notre infrastructure** :
    si tout tombe chez nous, cette page reste accessible et reflète l'incident.

    Pour l'état spécifique de votre site, connectez-vous sur votre [espace client](https://account.aonyx.site).
  navbar:
    - title: Statut
      href: /
    - title: Espace client
      href: https://account.aonyx.site
    - title: Site
      href: https://aonyx.site
  logoUrl: https://aonyx.site/logo.png   # adapter si besoin / supprimer pour le logo Upptime par défaut
  theme: light

