# ============================================================
# Upptime — status page Aonyx Hosting
# https://uptime.aonyx.fr — sondage indépendant via GitHub Actions
# ============================================================

owner: feiuz
repo: uptime-aonyx

# ------------------------------------------------------------
# Monitors : services publics partagés (frontaux Cloudflare → bastion .100)
# ------------------------------------------------------------
sites:
  # ----------------------------------------------------------
  # Vitrines publiques
  # ----------------------------------------------------------
  - name: Aonyx Hosting (commercial)
    url: https://aonyx.site
    # CF → bastion → ProxyPass control-plane (CT 400) → Next.js landing
    expectedStatusCodes: [200, 301, 302, 303, 307, 308]

  - name: Aonyx (vitrine .fr)
    url: https://aonyx.fr
    expectedStatusCodes: [200, 301, 302, 303, 307, 308]

  - name: Espace client
    url: https://account.aonyx.site
    expectedStatusCodes: [200, 301, 302, 303, 307, 308]

  - name: SSO Authentik
    url: https://auth.aonyx.site
    # 302 vers /outpost.goauthentik.io/start = la chaîne SSO répond
    expectedStatusCodes: [200, 302]

  - name: Control plane (manager)
    url: https://manager.aonyx.site
    # Authentik forward_auth → 302 vers /outpost.goauthentik.io/start
    expectedStatusCodes: [200, 302]

  # ----------------------------------------------------------
  # Health endpoint d'agrégation (bastion Apache + mod_php)
  # Cert Let's Encrypt installé le 2026-05-26 → switch HTTPS.
  # /var/www/health.aonyx.dev/index.php → 200 si TCP :22 du node répond.
  # ----------------------------------------------------------
  - name: Edge · bastion Pi (.100)
    # Le endpoint lui-même : si le bastion tombe, ça répond pas → on l'utilise comme probe edge.
    url: https://health.aonyx.dev/
    expectedStatusCodes: [200]

  - name: Cluster · aonyx (.105)
    url: https://health.aonyx.dev/?node=aonyx
    expectedStatusCodes: [200]

  - name: Cluster · minecraft-location (.5)
    url: https://health.aonyx.dev/?node=minecraft-location
    expectedStatusCodes: [200]

  - name: Cluster · aonyx-sites (.205)
    url: https://health.aonyx.dev/?node=aonyx-sites
    expectedStatusCodes: [200]

  - name: Cluster · aonyx-sites-clstr2 (.206)
    url: https://health.aonyx.dev/?node=aonyx-sites-clstr2
    expectedStatusCodes: [200]

  - name: Cluster · aonyx-sites-clstr3 (.207)
    url: https://health.aonyx.dev/?node=aonyx-sites-clstr3
    expectedStatusCodes: [200]

  - name: Cluster · aonyx-sites-clstr4 (.208)
    url: https://health.aonyx.dev/?node=aonyx-sites-clstr4
    expectedStatusCodes: [200]

  - name: Stockage · NAS Pi (.120)
    url: https://health.aonyx.dev/?node=nas
    expectedStatusCodes: [200]

# ------------------------------------------------------------
# Branding du status website public
# ------------------------------------------------------------
status-website:
  cname: uptime.aonyx.fr
  name: Aonyx Hosting · Status
  introTitle: "**Aonyx Hosting** — état des services en temps réel"
  introMessage: |
    État en temps réel des services partagés de l'infrastructure Aonyx Hosting.
    Les sondes tournent sur GitHub Actions toutes les 5 minutes — **indépendant de notre infrastructure** :
    si tout tombe chez nous, cette page reste accessible et reflète l'incident.

    Pour l'état spécifique de votre site, connectez-vous sur votre [espace client](https://account.aonyx.site).
  navbar:
    - title: Statut
      href: /
    - title: Espace client
      href: https://account.aonyx.site
    - title: Site
      href: https://aonyx.site
  logoUrl: https://aonyx.site/logo.png   # adapter si besoin / supprimer pour le logo Upptime par défaut
  theme: light

